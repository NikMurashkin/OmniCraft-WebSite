<svg width="512" height="512" viewBox="20 20 472 472" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
  <defs>
    <!-- 1. Мягкая космическая полупрозрачная аура (планетарный объём без мутного blur-фильтра) -->
    <radialGradient id="ambGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#7C3AED" stop-opacity="0.28"/>
      <stop offset="72%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <!-- 2. Латунные ремесленные градиенты -->
    <linearGradient id="brassOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- 3. Градиенты лент созидания -->
    <linearGradient id="violetRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="40%" stop-color="#C084FC"/>
      <stop offset="75%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>

    <linearGradient id="blueRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="80%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <!-- 4. Сочные грани 3D-куба-кристалла -->
    <linearGradient id="cubeTopVibrant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D0FE"/>
      <stop offset="40%" stop-color="#D8B4FE"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="cubeLeftVibrant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="45%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="cubeRightVibrant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="45%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="goldHeart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Фоновая полупрозрачная аура: сглаживает силуэт и делает логотип круглым и гармоничным -->
  <circle cx="256" cy="256" r="232" fill="url(#ambGlow)"/>

  <!-- 2. Прецизионные чертежные кольца цеховой калибровки -->
  <circle cx="256" cy="256" r="206" stroke="#C084FC" stroke-width="2.2" stroke-opacity="0.32" stroke-dasharray="6 8"/>
  <circle cx="256" cy="256" r="218" stroke="#38BDF8" stroke-width="1.6" stroke-opacity="0.3" stroke-dasharray="2 10"/>

  <!-- 3. Двойной вихрь созидания (плавные струящиеся ленты) -->
  <!-- Пурпурная лента (Услуги и Капитал) -->
  <path d="M120 220 C100 130 180 70 270 75 C360 80 430 150 435 240 C440 330 370 410 280 415 C200 420 140 365 130 300" 
        stroke="url(#violetRibbon)" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Лазурно-синяя лента (Производство и Верстак) -->
  <path d="M390 290 C410 380 330 440 240 435 C150 430 80 360 75 270 C70 180 140 100 230 95 C310 90 370 145 380 210" 
        stroke="url(#blueRibbon)" stroke-width="18" stroke-linecap="round"/>

  <!-- Глянцевые зеркальные блики по хребту дуг -->
  <path d="M140 190 C150 125 210 90 280 95 C350 100 405 155 410 225" 
        stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M370 320 C360 385 300 420 230 415 C160 410 105 355 100 285" 
        stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- 4. Центральный яркий цветной куб-кристалл (Vibrant Hexagonal Keystone) -->
  <!-- Левая грань (Производство) -->
  <polygon points="256,256 166,204 166,308 256,360" fill="url(#cubeLeftVibrant)" stroke="#60A5FA" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Правая грань (Услуги) -->
  <polygon points="256,256 346,204 346,308 256,360" fill="url(#cubeRightVibrant)" stroke="#818CF8" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Верхняя грань (Капитал) -->
  <polygon points="256,256 166,204 256,152 346,204" fill="url(#cubeTopVibrant)" stroke="#C084FC" stroke-width="2" stroke-linejoin="round"/>

  <!-- Золотые ребра куба -->
  <line x1="256" y1="152" x2="256" y2="256" stroke="url(#brassOuter)" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="166" y1="204" x2="256" y2="256" stroke="url(#brassOuter)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="346" y1="204" x2="256" y2="256" stroke="url(#brassOuter)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Тонкая разметка граней -->
  <line x1="211" y1="230" x2="211" y2="334" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.35"/>
  <line x1="301" y1="230" x2="301" y2="334" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- 5. Вершины и заклепки -->
  <circle cx="166" cy="204" r="7" fill="#0B0F19" stroke="url(#brassOuter)" stroke-width="2.2"/>
  <circle cx="166" cy="204" r="3" fill="#FFFFFF"/>

  <circle cx="346" cy="204" r="7" fill="#0B0F19" stroke="url(#brassOuter)" stroke-width="2.2"/>
  <circle cx="346" cy="204" r="3" fill="#FFFFFF"/>

  <circle cx="256" cy="152" r="7" fill="#0B0F19" stroke="url(#brassOuter)" stroke-width="2.2"/>
  <circle cx="256" cy="152" r="3" fill="#FFFFFF"/>

  <circle cx="256" cy="360" r="7" fill="#0B0F19" stroke="url(#brassOuter)" stroke-width="2.2"/>
  <circle cx="256" cy="360" r="3" fill="#FFFFFF"/>

  <circle cx="166" cy="308" r="5" fill="#38BDF8"/>
  <circle cx="346" cy="308" r="5" fill="#A855F7"/>

  <!-- 6. Сияющее Сердце Мастера (Золотая Звезда) -->
  <circle cx="256" cy="256" r="28" fill="url(#sparkGlow)"/>
  <circle cx="256" cy="256" r="22" fill="#0B0F19" stroke="url(#brassOuter)" stroke-width="2.6"/>
  
  <path d="M256 230 L261 247 L278 250 L263 257 L266 274 L256 262 L246 274 L249 257 L234 250 L251 247 Z" 
        fill="url(#goldHeart)"/>
  <circle cx="256" cy="253" r="4" fill="#FFFFFF"/>

  <!-- 7. Парящие спутники-искры -->
  <path d="M430 142 L433 154 L445 157 L433 160 L430 172 L427 160 L415 157 L427 154 Z" fill="url(#brassOuter)"/>
  <circle cx="430" cy="157" r="2.5" fill="#FFFFFF"/>

  <circle cx="85" cy="365" r="5" fill="#67E8F9"/>
  <circle cx="85" cy="365" r="2.5" fill="#FFFFFF"/>
</svg>
