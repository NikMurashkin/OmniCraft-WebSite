<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Фоновая аура помощника -->
    <radialGradient id="aiAtmosphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Корпус: матовый оружейный титан цеха -->
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="45%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="headShell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Ремесленная латунь и бронза -->
    <linearGradient id="brassBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Глубокий визор -->
    <linearGradient id="visorGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Энергия и телеметрия -->
    <linearGradient id="cyanCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="violetCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <!-- Свечения -->
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Фоновое поле и технологическая калибровка -->
  <circle cx="120" cy="120" r="105" fill="url(#aiAtmosphere)"/>
  <circle cx="120" cy="120" r="98" stroke="#8B5CF6" stroke-opacity="0.22" stroke-dasharray="3 7" stroke-width="1.2"/>
  <circle cx="120" cy="120" r="82" stroke="#38BDF8" stroke-opacity="0.18" stroke-dasharray="2 6" stroke-width="1"/>

  <!-- Микро-метки калибровки и искры крафта -->
  <circle cx="38" cy="62" r="2" fill="#38BDF8" filter="url(#aiGlow)"/>
  <path d="M38 56 V68 M32 62 H44" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.45"/>
  <circle cx="204" cy="68" r="2.2" fill="#FBBF24" filter="url(#aiGlow)"/>
  <circle cx="208" cy="148" r="1.5" fill="#34D399" opacity="0.8"/>
  <circle cx="34" cy="154" r="1.5" fill="#C084FC" opacity="0.7"/>
  <path d="M192 42 L193.5 45.5 L197 47 L193.5 48.5 L192 52 L190.5 48.5 L187 47 L190.5 45.5 Z" fill="#FDE68A" opacity="0.85"/>

  <!-- 2. Парящий пьедестал (Магнитная док-станция) -->
  <ellipse cx="120" cy="204" rx="52" ry="11" fill="#020617" fill-opacity="0.75"/>
  <ellipse cx="120" cy="202" rx="42" ry="7.5" fill="url(#violetCore)" fill-opacity="0.25" filter="url(#softGlow)"/>
  <ellipse cx="120" cy="201" rx="36" ry="5.5" stroke="#38BDF8" stroke-width="1.4" stroke-opacity="0.8"/>
  <line x1="84" y1="201" x2="156" y2="201" stroke="url(#brassBezel)" stroke-width="1" stroke-opacity="0.5"/>

  <!-- 3. Руки и манипуляторы робота -->
  <!-- Левая рука (уверенно держит ремесленный смарт-стилус) -->
  <g id="left-arm">
    <!-- Плечевой сустав -->
    <circle cx="76" cy="126" r="7" fill="#1E293B" stroke="url(#brassBezel)" stroke-width="1.5"/>
    <!-- Предплечье -->
    <path d="M74 130 C64 136 58 148 64 160 C66 164 72 165 77 161" stroke="#334155" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    <path d="M74 130 C64 136 58 148 64 160 C66 164 72 165 77 161" stroke="#475569" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Кистевой шарнир -->
    <circle cx="77" cy="160" r="5.5" fill="url(#brassBezel)"/>
    <!-- Цифровой калипер / смарт-стилус цеха -->
    <path d="M75 158 L52 142" stroke="url(#brassBezel)" stroke-width="3.2" stroke-linecap="round"/>
    <rect x="49" y="139" width="5" height="5" rx="1.5" fill="#1E293B" stroke="url(#brassBezel)" stroke-width="1"/>
    <!-- Острие с бирюзовым фотонным лучом -->
    <polygon points="46,137 54,142 50,149 42,144" fill="url(#cyanCore)" filter="url(#aiGlow)"/>
    <circle cx="47" cy="142" r="2" fill="#FFFFFF"/>
    <line x1="47" y1="133" x2="47" y2="135" stroke="#67E8F9" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="39" y1="142" x2="41" y2="142" stroke="#67E8F9" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Правая рука (дружелюбный приветственный жест мастера) -->
  <g id="right-arm">
    <!-- Плечевой сустав -->
    <circle cx="164" cy="126" r="7" fill="#1E293B" stroke="url(#brassBezel)" stroke-width="1.5"/>
    <!-- Предплечье с открытым жестом -->
    <path d="M166 130 C176 136 184 146 182 158 C180 164 173 166 167 161" stroke="#334155" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    <path d="M166 130 C176 136 184 146 182 158 C180 164 173 166 167 161" stroke="#475569" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Кистевой шарнир -->
    <circle cx="168" cy="160" r="5.5" fill="url(#brassBezel)"/>
    <!-- Открытая ладонь: три эргономичных пальца-сустава -->
    <path d="M168 159 C164 156 163 150 166 146" stroke="url(#brassBezel)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <path d="M171 161 C173 157 175 152 178 149" stroke="url(#brassBezel)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <path d="M174 163 C178 162 183 159 185 155" stroke="url(#brassBezel)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <!-- Сенсорный импульс на ладони -->
    <circle cx="169" cy="154" r="2.2" fill="#FBBF24" filter="url(#aiGlow)"/>
  </g>

  <!-- 4. Корпус (Массивный эргономичный торс) -->
  <g id="torso">
    <rect x="82" y="112" width="76" height="66" rx="20" fill="url(#metalPlate)" stroke="#475569" stroke-width="2"/>
    <!-- Верхний латунный кант и рельеф пластин -->
    <path d="M92 118 H148" stroke="url(#brassBezel)" stroke-width="2" stroke-linecap="round"/>
    <line x1="90" y1="130" x2="90" y2="160" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="150" y1="130" x2="150" y2="160" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Центральный реактор-ядро мастерской -->
    <circle cx="120" cy="144" r="16.5" fill="#0B132B" stroke="url(#brassBezel)" stroke-width="2"/>
    <circle cx="120" cy="144" r="13.5" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="120" cy="144" r="10.5" fill="url(#violetCore)" filter="url(#aiGlow)"/>
    <circle cx="120" cy="144" r="5" fill="#FFFFFF"/>

    <!-- Нижняя телеметрия: 3 LED-статуса (готовность, связь, действие) -->
    <g transform="translate(101, 164)">
      <!-- Зеленый: Система готова -->
      <circle cx="0" cy="0" r="3" fill="#10B981" filter="url(#aiGlow)"/>
      <circle cx="0" cy="0" r="1" fill="#FFFFFF"/>
      <!-- Синий: Контекст синхронен -->
      <circle cx="19" cy="0" r="3" fill="#38BDF8" filter="url(#aiGlow)"/>
      <circle cx="19" cy="0" r="1" fill="#FFFFFF"/>
      <!-- Янтарный: Действие ожидает подтверждения -->
      <circle cx="38" cy="0" r="3" fill="#F59E0B" filter="url(#aiGlow)"/>
      <circle cx="38" cy="0" r="1" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- 5. Шея и силовой шарнир -->
  <g id="neck">
    <rect x="108" y="103" width="24" height="11" rx="3.5" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <line x1="112" y1="108" x2="128" y2="108" stroke="url(#brassBezel)" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- 6. Голова робота: Дружелюбный, умный, внимательный взгляд -->
  <g id="head">
    <!-- Антенна связи с маяком -->
    <path d="M120 58 V44" stroke="url(#brassBezel)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="120" cy="40" r="6.5" fill="url(#cyanCore)" filter="url(#aiGlow)"/>
    <circle cx="120" cy="40" r="2.8" fill="#FFFFFF"/>
    <path d="M111 36 C115 33 125 33 129 36" stroke="#67E8F9" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M106 30 C114 24 126 24 134 30" stroke="#C084FC" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Латунные шарниры ушей-микрофонов -->
    <rect x="69" y="73" width="9" height="20" rx="3.5" fill="url(#brassBezel)"/>
    <rect x="162" y="73" width="9" height="20" rx="3.5" fill="url(#brassBezel)"/>
    <circle cx="73.5" cy="83" r="2.5" fill="#1E293B"/>
    <circle cx="166.5" cy="83" r="2.5" fill="#1E293B"/>

    <!-- Шлем робота -->
    <rect x="76" y="56" width="88" height="52" rx="18" fill="url(#headShell)" stroke="#64748B" stroke-width="2"/>
    <circle cx="84" cy="63" r="1.5" fill="#94A3B8"/>
    <circle cx="156" cy="63" r="1.5" fill="#94A3B8"/>

    <!-- Верхний защитный козырёк с латунным молдингом -->
    <path d="M80 61 C91 55 149 55 160 61" stroke="url(#brassBezel)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Темный глянцевый визор -->
    <rect x="83" y="66" width="74" height="34" rx="12" fill="url(#visorGlass)" stroke="url(#brassBezel)" stroke-width="1.5"/>

    <!-- Брови внимания / интеллектуальный фокус (без агрессии) -->
    <path d="M93 72 C98 70 106 70 110 72" stroke="url(#brassBezel)" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M130 72 C134 70 142 70 147 72" stroke="url(#brassBezel)" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Дружелюбные цифровые глаза визора (мягкий изогнутый взгляд с белым бликом) -->
    <!-- Левый глаз -->
    <path d="M94 81 C94 76 99 73 105 73 C111 73 115 76 115 81 C115 84 110 86 105 86 C99 86 94 84 94 81 Z"
          fill="url(#cyanCore)" filter="url(#aiGlow)"/>
    <circle cx="106.5" cy="79" r="2.4" fill="#FFFFFF"/>
    <!-- Мягкая дуга приветливого прищура -->
    <path d="M97 84 C101 87 108 87 112 84" stroke="#67E8F9" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>

    <!-- Правый глаз -->
    <path d="M125 81 C125 76 130 73 136 73 C142 73 146 76 146 81 C146 84 141 86 136 86 C130 86 125 84 125 81 Z"
          fill="url(#cyanCore)" filter="url(#aiGlow)"/>
    <circle cx="137.5" cy="79" r="2.4" fill="#FFFFFF"/>
    <!-- Мягкая дуга приветливого прищура -->
    <path d="M128 84 C132 87 139 87 143 84" stroke="#67E8F9" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>

    <!-- Тонкий спокойный LED-индикатор готовности (вместо детского рта/румянца) -->
    <line x1="116" y1="94" x2="124" y2="94" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>
