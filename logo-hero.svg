<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
  <defs>
    <!-- Deep Cosmic Ambient Glow -->
    <radialGradient id="ambGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Craft Gradients -->
    <linearGradient id="brassOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Ribbon Gradients -->
    <linearGradient id="violetRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>

    <linearGradient id="blueRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <!-- Vibrant Cube Gradients -->
    <linearGradient id="cubeTopVibrant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <linearGradient id="cubeLeftVibrant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="cubeRightVibrant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <linearGradient id="goldHeart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="optGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Ambient Glow -->
  <circle cx="256" cy="256" r="236" fill="url(#ambGlow)"/>

  <!-- 2. Precision Calibration Rings -->
  <circle cx="256" cy="256" r="204" stroke="#8B5CF6" stroke-width="2.5" stroke-opacity="0.3" stroke-dasharray="6 8"/>
  <circle cx="256" cy="256" r="216" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="2 12"/>

  <!-- 3. Dual Interlocking Ribbons -->
  <path d="M120 220 C100 130 180 70 270 75 C360 80 430 150 435 240 C440 330 370 410 280 415 C200 420 140 365 130 300" 
        stroke="url(#violetRibbon)" stroke-width="22" stroke-linecap="round" filter="url(#optGlow)"/>
  
  <path d="M390 290 C410 380 330 440 240 435 C150 430 80 360 75 270 C70 180 140 100 230 95 C310 90 370 145 380 210" 
        stroke="url(#blueRibbon)" stroke-width="16" stroke-linecap="round"/>

  <!-- Specular Highlights -->
  <path d="M140 190 C150 125 210 90 280 95 C350 100 405 155 410 225" 
        stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M370 320 C360 385 300 420 230 415 C160 410 105 355 100 285" 
        stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- 4. Vibrant Cube Keystone -->
  <polygon points="256,256 166,204 166,308 256,360" fill="url(#cubeLeftVibrant)" stroke="#60A5FA" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="256,256 346,204 346,308 256,360" fill="url(#cubeRightVibrant)" stroke="#818CF8" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="256,256 166,204 256,152 346,204" fill="url(#cubeTopVibrant)" stroke="#C084FC" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Brass Ribs -->
  <line x1="256" y1="152" x2="256" y2="256" stroke="url(#brassOuter)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="166" y1="204" x2="256" y2="256" stroke="url(#brassOuter)" stroke-width="2" stroke-linecap="round"/>
  <line x1="346" y1="204" x2="256" y2="256" stroke="url(#brassOuter)" stroke-width="2" stroke-linecap="round"/>

  <line x1="211" y1="230" x2="211" y2="334" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.3"/>
  <line x1="301" y1="230" x2="301" y2="334" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- 5. Rivets -->
  <circle cx="166" cy="204" r="7" fill="#0F172A" stroke="url(#brassOuter)" stroke-width="2.5"/>
  <circle cx="166" cy="204" r="3" fill="#FFFFFF"/>

  <circle cx="346" cy="204" r="7" fill="#0F172A" stroke="url(#brassOuter)" stroke-width="2.5"/>
  <circle cx="346" cy="204" r="3" fill="#FFFFFF"/>

  <circle cx="256" cy="152" r="7" fill="#0F172A" stroke="url(#brassOuter)" stroke-width="2.5"/>
  <circle cx="256" cy="152" r="3" fill="#FFFFFF"/>

  <circle cx="256" cy="360" r="7" fill="#0F172A" stroke="url(#brassOuter)" stroke-width="2.5"/>
  <circle cx="256" cy="360" r="3" fill="#FFFFFF"/>

  <circle cx="166" cy="308" r="5" fill="#38BDF8"/>
  <circle cx="346" cy="308" r="5" fill="#A855F7"/>

  <!-- 6. Master's Golden Spark Core -->
  <circle cx="256" cy="256" r="28" fill="url(#sparkGlow)"/>
  <circle cx="256" cy="256" r="22" fill="#0F172A" stroke="url(#brassOuter)" stroke-width="3"/>
  
  <path d="M256 230 L261 247 L278 250 L263 257 L266 274 L256 262 L246 274 L249 257 L234 250 L251 247 Z" 
        fill="url(#goldHeart)"/>
  <circle cx="256" cy="253" r="4" fill="#FFFFFF"/>

  <!-- 7. Satellites -->
  <path d="M430 142 L433 154 L445 157 L433 160 L430 172 L427 160 L415 157 L427 154 Z" fill="url(#brassOuter)" filter="url(#optGlow)"/>
  <circle cx="430" cy="157" r="2.5" fill="#FFFFFF"/>

  <circle cx="85" cy="365" r="5.5" fill="#67E8F9" filter="url(#optGlow)"/>
  <circle cx="85" cy="365" r="2.5" fill="#FFFFFF"/>
  <path d="M85 355 V375 M75 365 H95" stroke="#67E8F9" stroke-width="1.2" stroke-linecap="round"/>

  <circle cx="115" cy="115" r="3" fill="#FBBF24" opacity="0.8"/>
  <circle cx="395" cy="385" r="3" fill="#A78BFA" opacity="0.8"/>
  <circle cx="320" cy="65" r="2" fill="#38BDF8" opacity="0.9"/>
  <circle cx="195" cy="445" r="2" fill="#FBBF24" opacity="0.9"/>
</svg>
