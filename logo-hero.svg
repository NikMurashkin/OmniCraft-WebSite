<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
  <defs>
    
    <!-- Ambient Space Glow -->
    <radialGradient id="ambGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <!-- Master's Brass / Gold Gradients -->
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE68A"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <radialGradient id="goldCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Vibrant Cube Face Gradients (Matching OmniCraft Design System) -->
    <!-- Top Face: Capital / Services / Royal Violet -->
    <linearGradient id="cubeTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="35%" stop-color="#C084FC"/>
      <stop offset="85%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#FAF5FF"/>
    </linearGradient>

    <!-- Left Face: Production / Workbench / Cobalt & Cyan -->
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <!-- Right Face: Accounting / Order / Deep Indigo -->
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <!-- Aerodynamic Orbit Ribbon Gradient (Cyan -> Indigo -> Violet -> Pink) -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#818CF8"/>
      <stop offset="75%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Мягкая космическая аура (глубина и объём) -->
  <circle cx="256" cy="256" r="236" fill="url(#ambGlow)"/>

  <!-- 2. Прецизионные чертёжные кольца калибровки (паритет с HeroTrustBar и иконками сайта) -->
  <circle cx="256" cy="256" r="212" stroke="#818CF8" stroke-width="1.8" stroke-dasharray="6 8" opacity="0.32"/>
  <circle cx="256" cy="256" r="226" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="2 10" opacity="0.22"/>

  <!-- Координатные риски на осях калибровки (стиль цехового штангенциркуля) -->
  <line x1="256" y1="36" x2="256" y2="44" stroke="#818CF8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="256" y1="468" x2="256" y2="476" stroke="#818CF8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="36" y1="256" x2="44" y2="256" stroke="#818CF8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="468" y1="256" x2="476" y2="256" stroke="#818CF8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- 3. Задняя дуга динамической орбиты -->
  <path d="M 100 280 C 80 180 160 90 260 88 C 345 86 420 145 435 225" 
        stroke="url(#orbitGrad)" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
  <!-- Зеркальный блик по верхнему хребту дуги -->
  <path d="M 115 260 C 100 185 170 108 260 106 C 335 104 400 155 418 220" 
        stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" opacity="0.45"/>

  <!-- 4. Изометрический Кристалл Верстака (R=126) -->
  <polygon points="147,193 256,256 256,382 147,319" fill="url(#cubeLeft)"/>
  <polygon points="256,256 365,193 365,319 256,382" fill="url(#cubeRight)"/>
  <polygon points="256,130 365,193 256,256 147,193" fill="url(#cubeTop)"/>

  <!-- Латунные рёбра сопряжения -->
  <line x1="256" y1="130" x2="256" y2="256" stroke="url(#goldShine)" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="147" y1="193" x2="256" y2="256" stroke="url(#goldShine)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="365" y1="193" x2="256" y2="256" stroke="url(#goldShine)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Внешний рельефный контур кристалла -->
  <polygon points="256,130 365,193 365,319 256,382 147,319 147,193" 
           stroke="rgba(255,255,255,0.22)" stroke-width="2" stroke-linejoin="round"/>

  <!-- 5. Передняя дуга динамической орбиты -->
  <path d="M 435 225 C 445 285 410 380 320 415 C 235 448 135 410 95 330" 
        stroke="url(#orbitGrad)" stroke-width="22" stroke-linecap="round"/>
  <!-- Зеркальный блик по нижнему хребту дуги -->
  <path d="M 418 240 C 425 290 395 370 315 400 C 245 425 155 395 115 335" 
        stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" opacity="0.5"/>

  <!-- 6. Сияющее Сердце Мастера (Главный акцент) -->
  <circle cx="256" cy="256" r="42" fill="url(#goldCoreGlow)"/>
  <path d="M 256 216 L 264 248 L 296 256 L 264 264 L 256 296 L 248 264 L 216 256 L 248 248 Z" 
        fill="url(#goldShine)" filter="drop-shadow(0 2px 8px rgba(245,158,11,0.5))"/>
  <circle cx="256" cy="256" r="3.5" fill="#FFFFFF"/>

  <!-- 7. Элегантные искры-спутники калибровки (паритет с HeroTrustBar) -->
  <!-- Верхняя правая искра -->
  <path d="M 435 140 L 437.5 149 L 447 151.5 L 437.5 154 L 435 163 L 432.5 154 L 423 151.5 L 432.5 149 Z" fill="url(#goldShine)"/>
  <circle cx="435" cy="151.5" r="2" fill="#FFFFFF"/>

  <!-- Нижняя левая искра -->
  <circle cx="82" cy="360" r="5" fill="#38BDF8" opacity="0.8"/>
  <circle cx="82" cy="360" r="2.2" fill="#FFFFFF"/>
</svg>